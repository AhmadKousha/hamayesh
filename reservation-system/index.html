<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سامانه رزرو سالن</title>

<!-- ===== PWA Meta Tags ===== -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:#eef2f7;color:#1a1a2e;min-height:100vh;-webkit-tap-highlight-color:transparent;overflow:hidden;height:100vh}

.app{max-width:480px;margin:auto;height:100vh;background:linear-gradient(180deg,#f8faff 0%,#eef2f7 100%);position:relative;overflow:hidden;display:flex;flex-direction:column}

/* ===== هدر ===== */
.header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 60%,#0f3460 100%);color:#fff;padding:16px 18px 14px;flex-shrink:0;border-radius:0 0 32px 32px;box-shadow:0 8px 32px rgba(15,52,96,0.25)}
.header .top{display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:17px;font-weight:800;display:flex;align-items:center;gap:6px}
.header .sub{font-size:11px;opacity:.7;margin-top:2px;font-weight:300}
.header .date-badge{background:rgba(255,255,255,0.12);backdrop-filter:blur(8px);padding:3px 12px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid rgba(255,255,255,0.08)}

/* ===== محتوا ===== */
.main{flex:1;overflow-y:auto;padding:14px 14px 80px;-webkit-overflow-scrolling:touch}
.screen{display:none;animation:slideUp .35s cubic-bezier(.22,.68,0,1)}
.screen.active{display:block}
@keyframes slideUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

/* ===== کارت‌ها ===== */
.card{background:rgba(255,255,255,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.6);box-shadow:0 2px 16px rgba(0,0,0,0.04)}
.card-title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;color:#1a1a2e}

/* ===== دکمه‌ها ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:600;font-size:13px;border:none;cursor:pointer;width:100%;transition:all .2s cubic-bezier(.22,.68,0,1);font-family:'Vazirmatn',sans-serif;position:relative;overflow:hidden;touch-action:manipulation}
.btn:active{transform:scale(.95)}
.btn-primary{background:linear-gradient(135deg,#1a1a2e,#0f3460);color:#fff;box-shadow:0 4px 16px rgba(15,52,96,0.2)}
.btn-success{background:linear-gradient(135deg,#119447,#0d7a3a);color:#fff;box-shadow:0 4px 16px rgba(17,148,71,0.2)}
.btn-danger{background:linear-gradient(135deg,#d83b3b,#b71c1c);color:#fff;width:auto;padding:4px 14px;font-size:11px;border-radius:8px;box-shadow:0 2px 10px rgba(216,59,59,0.2)}
.btn-ghost{background:rgba(26,26,46,0.05);color:#1a1a2e}
.btn-ghost:active{background:rgba(26,26,46,0.12)}
.btn-sm{padding:5px 12px;font-size:11px;width:auto;border-radius:8px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ===== فرم ===== */
label{display:block;font-size:11px;font-weight:600;color:#3d4a5f;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:2px solid rgba(0,0,0,0.05);border-radius:12px;font-size:13px;transition:all .25s;outline:none;font-family:'Vazirmatn',sans-serif;background:rgba(255,255,255,0.7);color:#1a1a2e;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:#0f3460;box-shadow:0 0 0 4px rgba(15,52,96,0.06);background:#fff}
input::placeholder,textarea::placeholder{color:#b0bec5}
textarea{min-height:50px;resize:vertical}

/* فیلد تاریخ */
.date-field{position:relative}
.date-field input{padding-left:44px;cursor:pointer}
.date-field .cal-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:20px;cursor:pointer;background:transparent;border:none;padding:4px;border-radius:8px;transition:all .2s;line-height:1}
.date-field .cal-icon:active{transform:translateY(-50%) scale(.8)}

/* ===== تقویم کوچک ===== */
.mini-calendar{background:rgba(255,255,255,0.97);backdrop-filter:blur(20px);border-radius:14px;padding:14px;border:1px solid rgba(255,255,255,0.5);margin-top:8px;display:none;box-shadow:0 8px 40px rgba(0,0,0,0.1)}
.mini-calendar.open{display:block;animation:fadeScale .25s ease}
@keyframes fadeScale{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.mini-cal .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mini-cal .cal-head button{background:rgba(0,0,0,0.04);border:none;padding:3px 12px;border-radius:8px;font-size:15px;cursor:pointer;font-family:'Vazirmatn',sans-serif;transition:all .2s;touch-action:manipulation}
.mini-cal .cal-head button:active{transform:scale(.9)}
.mini-cal .cal-head .month{font-size:14px;font-weight:700}
.mini-cal .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mini-cal .dow{text-align:center;font-size:9px;color:#8a9bb5;padding:4px 0;font-weight:600}
.mini-cal .day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;border:none;background:transparent;font-size:12px;cursor:pointer;font-weight:500;transition:all .15s;font-family:'Vazirmatn',sans-serif;touch-action:manipulation}
.mini-cal .day:active{transform:scale(.8)}
.mini-cal .day.today{background:rgba(15,52,96,0.08);border:2px solid rgba(15,52,96,0.12);font-weight:700}
.mini-cal .day.selected{background:linear-gradient(135deg,#1a1a2e,#0f3460);color:#fff}
.mini-cal .day.has-dot{position:relative}
.mini-cal .day.has-dot::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;background:#119447;border-radius:50%}
.mini-cal .day.empty{background:transparent;cursor:default}

/* ===== آمار ===== */
.stat-card{background:rgba(255,255,255,0.7);border-radius:14px;padding:14px 12px;text-align:center;border:1px solid rgba(255,255,255,0.4);transition:all .2s}
.stat-card:active{transform:scale(.97)}
.stat-card .num{font-size:28px;font-weight:900;display:block;margin-top:2px;background:linear-gradient(135deg,#1a1a2e,#0f3460);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-card .num.green{-webkit-text-fill-color:#119447}
.stat-card .num.orange{-webkit-text-fill-color:#e67e22}
.stat-card .label{font-size:11px;color:#6b7a8f;font-weight:500}

/* ===== سالن‌ها ===== */
.hall-card{background:rgba(255,255,255,0.6);border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.3);transition:all .2s}
.hall-card:active{transform:scale(.98)}
.hall-card .head{display:flex;justify-content:space-between;align-items:center}
.hall-card .name{font-weight:600;font-size:13px;display:flex;align-items:center;gap:4px}
.badge{display:inline-block;padding:2px 10px;border-radius:16px;font-size:10px;font-weight:600}
.badge-free{background:#e8f5e9;color:#119447}
.badge-busy{background:#fce4ec;color:#c62828}
.badge-hall{background:rgba(15,52,96,0.08);color:#0f3460;font-size:9px}

/* ===== آیتم رزرو ===== */
.res-item{background:rgba(255,255,255,0.65);border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.3);transition:all .2s}
.res-item:active{transform:scale(.98)}
.res-item .row{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.res-item .res-title{font-weight:600;font-size:13px;flex:1}
.res-item .res-meta{font-size:11px;color:#6b7a8f;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.res-item .res-meta span{background:rgba(0,0,0,0.03);padding:1px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:3px}

/* ===== هدر صفحه رزرو ===== */
.reserve-header{background:linear-gradient(135deg,#1a1a2e,#0f3460);color:#fff;padding:14px 16px;border-radius:16px;display:flex;align-items:center;gap:10px;margin-bottom:14px;box-shadow:0 4px 16px rgba(15,52,96,0.15)}
.reserve-header .back-btn{background:rgba(255,255,255,0.1);border:none;border-radius:10px;padding:4px 12px;font-size:18px;cursor:pointer;color:#fff;transition:all .2s;line-height:1;touch-action:manipulation}
.reserve-header .back-btn:active{transform:scale(.85)}
.reserve-header .date-display{font-size:15px;font-weight:700;flex:1}
.reserve-header .date-display small{display:block;font-size:10px;font-weight:400;opacity:.65;margin-top:1px}

/* ===== منوی پایین ===== */
.bottom-nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:452px;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px;box-shadow:0 4px 24px rgba(0,0,0,0.06);border:1px solid rgba(255,255,255,0.4);display:flex;padding:3px;z-index:40}
.bottom-nav button{flex:1;background:transparent;border:none;padding:6px 2px;border-radius:18px;font-size:9px;color:#8a9bb5;cursor:pointer;transition:all .3s cubic-bezier(.22,.68,0,1);font-family:'Vazirmatn',sans-serif;display:flex;flex-direction:column;align-items:center;gap:0;touch-action:manipulation}
.bottom-nav button .icon{font-size:20px;line-height:1.2}
.bottom-nav button .label{font-size:9px;font-weight:500}
.bottom-nav button.active{background:linear-gradient(135deg,#1a1a2e,#0f3460);color:#fff;box-shadow:0 4px 12px rgba(15,52,96,0.2)}

/* ===== تقویم اصلی ===== */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-grid .dow{text-align:center;font-size:10px;color:#8a9bb5;padding:4px 0;font-weight:600}
.cal-grid .day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;border:none;background:rgba(255,255,255,0.4);font-size:13px;cursor:pointer;font-weight:500;transition:all .2s cubic-bezier(.22,.68,0,1);font-family:'Vazirmatn',sans-serif;position:relative;min-height:38px;touch-action:manipulation}
.cal-grid .day:active{transform:scale(.85)}
.cal-grid .day.today{background:rgba(15,52,96,0.06);border:2px solid rgba(15,52,96,0.12);font-weight:700}
.cal-grid .day.selected{background:linear-gradient(135deg,#1a1a2e,#0f3460);color:#fff;box-shadow:0 4px 12px rgba(15,52,96,0.15)}
.cal-grid .day.has-dot .dot{position:absolute;bottom:4px;width:4px;height:4px;background:#119447;border-radius:50%}
.cal-grid .day .count{font-size:7px;background:rgba(17,148,71,0.12);color:#119447;padding:0 5px;border-radius:4px;font-weight:700;margin-top:1px}
.cal-grid .day.selected .count{background:rgba(255,255,255,0.2);color:#fff}
.cal-grid .day.empty{background:transparent;cursor:default}

/* ===== هشدار ===== */
.alert{padding:10px 14px;border-radius:12px;font-size:11px;margin-top:8px;display:flex;align-items:center;gap:6px}
.alert-danger{background:#fce4ec;color:#c62828;border:1px solid #ffcdd2}
.alert-success{background:#e8f5e9;color:#2e7d32;border:1px solid #c8e6c9}
.alert-info{background:#e3f2fd;color:#0d47a1;border:1px solid #bbdefb}

/* ===== استایل‌های کمکی ===== */
.muted{color:#8a9bb5;font-size:11px}
.text-center{text-align:center}
.mt-6{margin-top:6px}
.mb-6{margin-bottom:6px}
.flex{display:flex;align-items:center;gap:6px}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.w-full{width:100%}
.gap-3{gap:3px}

/* اسکرول مخفی */
::-webkit-scrollbar{width:0}

/* بهینه‌سازی برای صفحه‌های کوچک */
@media(max-width:360px){
  .header h1{font-size:15px}
  .header .sub{font-size:10px}
  .header .date-badge{font-size:10px;padding:2px 10px}
  .card{padding:12px;border-radius:14px}
  .btn{padding:10px 14px;font-size:12px;border-radius:10px}
  .stat-card .num{font-size:24px}
}
</style>
</head>
<body>

<div class="app">

<!-- ===== هدر ===== -->
<div class="header">
  <div class="top">
    <div>
      <h1>🏛️ سامانه رزرو</h1>
      <div class="sub">مدیریت سالن‌های همایش</div>
    </div>
    <div class="date-badge" id="headerDate"></div>
  </div>
</div>

<!-- ===== محتوای اصلی ===== -->
<div class="main">

  <!-- صفحه خانه -->
  <section id="home" class="screen active">
    <div class="card">
      <div class="card-title">📊 داشبورد</div>
      <div class="grid2">
        <div class="stat-card"><span class="label">رزرو امروز</span><span class="num green" id="todayCount">۰</span></div>
        <div class="stat-card"><span class="label">رزرو آینده</span><span class="num orange" id="futureCount">۰</span></div>
      </div>
    </div>
    <div class="card">
      <div class="flex-between"><span class="card-title" style="margin-bottom:0">📋 وضعیت سالن‌ها</span><span class="muted" id="homeDate"></span></div>
      <div id="hallStatus" style="margin-top:8px"></div>
    </div>
    <div class="grid2">
      <button class="btn btn-success" onclick="show('new')">➕ ثبت رزرو</button>
      <button class="btn btn-primary" onclick="show('calendar')">📅 تقویم</button>
    </div>
  </section>

  <!-- صفحه تقویم -->
  <section id="calendar" class="screen">
    <div class="card">
      <div class="flex-between">
        <button class="btn btn-ghost btn-sm" onclick="changeMonth(-1)">‹</button>
        <span class="card-title" style="margin-bottom:0;font-size:16px" id="monthTitle"></span>
        <button class="btn btn-ghost btn-sm" onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-grid" id="calendarGrid" style="margin-top:8px"></div>
      <div style="margin-top:10px;display:flex;gap:12px;justify-content:center;font-size:10px;color:#8a9bb5">
        <span style="display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#119447"></span> روز رزرو شده</span>
        <span style="display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:6px;height:6px;border-radius:3px;border:2px solid rgba(15,52,96,0.3)"></span> امروز</span>
      </div>
    </div>
    <div class="card">
      <div class="flex-between"><span class="card-title" style="margin-bottom:0">📋 رزروهای روز</span><span class="muted" id="selectedDateTitle"></span></div>
      <div id="daySchedule" style="margin-top:6px"></div>
      <button class="btn btn-success mt-6" onclick="openReservePage()">➕ ثبت رزرو برای این روز</button>
    </div>
  </section>

  <!-- صفحه رزرو از تقویم -->
  <section id="reservePage" class="screen">
    <div class="reserve-header">
      <button class="back-btn" onclick="show('calendar')">‹</button>
      <div class="date-display">
        <span id="reserveDateTitle">انتخاب تاریخ</span>
        <small>ثبت رزرو جدید</small>
      </div>
    </div>
    <div class="card">
      <div class="card-title">🏛️ اطلاعات رزرو</div>
      <label>سالن</label>
      <select id="rHall"><option>آمفی‌تئاتر غدیر</option><option>سالن کنفرانس</option></select>
      <div class="grid2">
        <div><label>🕐 ساعت شروع</label><input id="rStart" type="time"></div>
        <div><label>🕐 ساعت پایان</label><input id="rEnd" type="time"></div>
      </div>
      <label>📝 عنوان برنامه</label>
      <input id="rTitle" placeholder="مثلاً جلسه هیئت رئیسه">
      <label>👤 درخواست‌کننده</label>
      <input id="rRequester" placeholder="نام واحد یا شخص">
      <label>📄 توضیحات</label>
      <textarea id="rDesc" placeholder="توضیحات اختیاری"></textarea>
      <div id="conflict"></div>
      <button class="btn btn-success mt-6" onclick="saveReserve()">✅ ثبت رزرو</button>
    </div>
    <div class="card">
      <div class="card-title">📋 رزروهای این روز</div>
      <div id="dayReserves"></div>
    </div>
  </section>

  <!-- صفحه ثبت رزرو عمومی -->
  <section id="new" class="screen">
    <div class="card-title">➕ ثبت رزرو جدید</div>
    <div class="card">
      <label>📅 تاریخ شمسی</label>
      <div class="date-field">
        <input id="rDateGeneral" type="text" placeholder="روی 📅 کلیک کنید" readonly style="cursor:pointer">
        <button class="cal-icon" onclick="toggleMiniCalendar()">📅</button>
      </div>
      
      <div class="mini-calendar" id="miniCalendar">
        <div class="mini-cal">
          <div class="cal-head">
            <button onclick="miniChangeMonth(-1)">‹</button>
            <span class="month" id="miniMonthTitle"></span>
            <button onclick="miniChangeMonth(1)">›</button>
          </div>
          <div class="cal-grid" id="miniCalendarGrid"></div>
        </div>
        <button class="btn btn-ghost btn-sm mt-6" onclick="toggleMiniCalendar()" style="width:100%">✕ بستن</button>
      </div>
      
      <label>🏛️ سالن</label>
      <select id="rHallGeneral"><option>آمفی‌تئاتر غدیر</option><option>سالن کنفرانس</option></select>
      <div class="grid2">
        <div><label>🕐 ساعت شروع</label><input id="rStartGeneral" type="time"></div>
        <div><label>🕐 ساعت پایان</label><input id="rEndGeneral" type="time"></div>
      </div>
      <label>📝 عنوان برنامه</label>
      <input id="rTitleGeneral" placeholder="مثلاً جلسه هیئت رئیسه">
      <label>👤 درخواست‌کننده</label>
      <input id="rRequesterGeneral" placeholder="نام واحد یا شخص">
      <label>📄 توضیحات</label>
      <textarea id="rDescGeneral" placeholder="توضیحات اختیاری"></textarea>
      <div id="conflictGeneral"></div>
      <button class="btn btn-success mt-6" onclick="saveGeneral()">✅ ثبت رزرو</button>
    </div>
  </section>

  <!-- صفحه لیست رزروها -->
  <section id="reservations" class="screen">
    <div class="card-title">📋 لیست رزروها</div>
    <div class="card">
      <input id="search" placeholder="🔍 جستجو در رزروها..." oninput="renderReservations()">
    </div>
    <div id="reservationList"></div>
  </section>

</div>

<!-- ===== منوی پایین ===== -->
<div class="bottom-nav">
  <button onclick="show('home')" data-s="home" class="active"><span class="icon">🏠</span><span class="label">خانه</span></button>
  <button onclick="show('calendar')" data-s="calendar"><span class="icon">📅</span><span class="label">تقویم</span></button>
  <button onclick="show('new')" data-s="new"><span class="icon">➕</span><span class="label">ثبت</span></button>
  <button onclick="show('reservations')" data-s="reservations"><span class="icon">📋</span><span class="label">رزروها</span></button>
</div>

</div>

<script>
// ===== توابع تبدیل تاریخ =====
const months=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function pad(n){return String(n).padStart(2,'0')}
function faDigits(n){return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}

function jalaliToGregorian(jy,jm,jd){
  let gy=jy+1595, days=-355668+365*gy+Math.floor(gy/33)*8+Math.floor((gy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);
  let gYear=400*Math.floor(days/146097); days%=146097;
  if(days>36524){gYear+=100*Math.floor(--days/36524); days%=36524; if(days>=365) days++}
  gYear+=4*Math.floor(days/1461); days%=1461; if(days>365){gYear+=Math.floor((days-1)/365); days=(days-1)%365}
  let gd=days+1, gdm=[0,31,(gYear%4===0&&(gYear%100!==0||gYear%400===0))?29:28,31,30,31,30,31,31,30,31,30,31], gm=1;
  while(gd>gdm[gm]){gd-=gdm[gm]; gm++}
  return [gYear,gm,gd]
}

function gregorianToJalali(gy,gm,gd){
  let gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  let gy2=gy+(gm>2?1:0), days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+gdm[gm-1];
  let jy=-1595+33*Math.floor(days/12053); days%=12053; jy+=4*Math.floor(days/1461); days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365); days=(days-1)%365}
  let jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30), jd=1+(days<186?days%31:(days-186)%30);
  return [jy,jm,jd]
}

function todayG(){let d=new Date();return [d.getFullYear(),d.getMonth()+1,d.getDate()]}
function gstr(a){return a[0]+'-'+pad(a[1])+'-'+pad(a[2])}
function jstr(g){let j=gregorianToJalali(g[0],g[1],g[2]); return faDigits(j[0])+'/'+faDigits(pad(j[1]))+'/'+faDigits(pad(j[2]))}
function nowJ(){return gregorianToJalali(...todayG())}
function parseJalali(s){
  s=(s||'').trim().replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  let m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(!m)return null;
  let jy=+m[1],jm=+m[2],jd=+m[3];
  if(jm<1||jm>12||jd<1||jd>(jm<=6?31:(jm<=11?30:30)))return null;
  return jalaliToGregorian(jy,jm,jd);
}

// ===== داده‌ها =====
let state=JSON.parse(localStorage.getItem('reservations_v5')||'{"reservations":[],"notes":[]}');
let viewJ=nowJ();
let selected=gstr(todayG());
let miniViewJ=nowJ();

function save(){localStorage.setItem('reservations_v5',JSON.stringify(state))}
function dayRes(date){return state.reservations.filter(r=>r.date===date).sort((a,b)=>a.start.localeCompare(b.start))}
function conflict(date,hall,start,end){return dayRes(date).some(r=>r.hall===hall && r.start<end && start<r.end)}

// ===== نمایش صفحات =====
function show(id){
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.s===id));
  
  if(id==='home') renderHome();
  if(id==='calendar') renderCalendar();
  if(id==='reservations') renderReservations();
  if(id==='reservePage') renderDayReserves(selected);
  if(id==='new') renderMiniCalendar();
  
  document.getElementById('headerDate').textContent=jstr(todayG());
  document.querySelector('.main').scrollTop=0;
}

// ===== صفحه خانه =====
function renderHome(){
  let td=gstr(todayG()), all=state.reservations;
  document.getElementById('homeDate').textContent=jstr(todayG());
  document.getElementById('todayCount').textContent=faDigits(all.filter(r=>r.date===td).length);
  document.getElementById('futureCount').textContent=faDigits(all.filter(r=>r.date>=td).length);
  
  let html='';
  ['آمفی‌تئاتر غدیر','سالن کنفرانس'].forEach(h=>{
    let rs=dayRes(td).filter(r=>r.hall===h);
    html+=`<div class="hall-card"><div class="head"><span class="name">🏛️ ${h}</span><span class="badge ${rs.length?'badge-busy':'badge-free'}">${rs.length?faDigits(rs.length)+' رزرو':'آزاد'}</span></div>`;
    rs.forEach(r=>html+=`<div class="muted" style="margin-top:3px">🕐 ${r.start} - ${r.end} &nbsp;•&nbsp; ${r.title}</div>`);
    html+='</div>';
  });
  document.getElementById('hallStatus').innerHTML=html;
}

// ===== تقویم اصلی =====
function monthDays(jy,jm){
  let next=jm===12?[jy+1,1]:[jy,jm+1];
  let g1=jalaliToGregorian(jy,jm,1);
  let g2=jalaliToGregorian(next[0],next[1],1);
  return Math.round((new Date(g2[0],g2[1]-1,g2[2]) - new Date(g1[0],g1[1]-1,g1[2]))/86400000);
}

function renderCalendar(){
  document.getElementById('monthTitle').textContent=months[viewJ[1]-1]+' '+faDigits(viewJ[0]);
  let firstG=jalaliToGregorian(viewJ[0],viewJ[1],1);
  let firstDow=new Date(firstG[0],firstG[1]-1,firstG[2]).getDay();
  let rtlOffset=(firstDow+1)%7;
  let days=monthDays(viewJ[0],viewJ[1]);
  let names=['ش','ی','د','س','چ','پ','ج'];
  
  let html=names.map(n=>`<div class="dow">${n}</div>`).join('');
  for(let i=0;i<rtlOffset;i++) html+='<div class="day empty"></div>';
  
  for(let d=1; d<=days; d++){
    let g=jalaliToGregorian(viewJ[0],viewJ[1],d);
    let ds=gstr(g);
    let has=dayRes(ds).length;
    let isToday=ds===gstr(todayG());
    let isSel=ds===selected;
    let cls='day';
    if(isToday) cls+=' today';
    if(isSel) cls+=' selected';
    if(has) cls+=' has-dot';
    let countHtml=has>0?`<span class="count">${faDigits(has)}</span>`:'';
    let dotHtml=has>0?'<span class="dot"></span>':'';
    html+=`<button class="${cls}" onclick="dayClick('${ds}')"><span>${faDigits(d)}</span>${countHtml}${dotHtml}</button>`;
  }
  document.getElementById('calendarGrid').innerHTML=html;
  renderSelected();
}

function changeMonth(n){
  viewJ[1]+=n;
  if(viewJ[1]<1){viewJ[1]=12; viewJ[0]--}
  if(viewJ[1]>12){viewJ[1]=1; viewJ[0]++}
  renderCalendar();
}

function dayClick(ds){
  selected=ds;
  let j=gregorianToJalali(...ds.split('-').map(Number));
  viewJ=[j[0],j[1]];
  openReservePage();
}

function renderSelected(){
  let j=gregorianToJalali(...selected.split('-').map(Number));
  document.getElementById('selectedDateTitle').textContent=faDigits(j[2])+' '+months[j[1]-1]+' '+faDigits(j[0]);
  let rs=dayRes(selected);
  if(rs.length){
    document.getElementById('daySchedule').innerHTML=rs.map(r=>`
      <div class="res-item"><div class="row"><span class="res-title">${r.title}</span><span class="badge badge-hall">${r.hall}</span></div>
      <div class="res-meta"><span>🕐 ${r.start} - ${r.end}</span><span>👤 ${r.requester}</span></div>
      </div>`).join('');
  }else{
    document.getElementById('daySchedule').innerHTML='<div class="muted text-center" style="padding:10px 0">✨ رزروی برای این روز وجود ندارد</div>';
  }
}

// ===== صفحه رزرو =====
function openReservePage(){
  let j=gregorianToJalali(...selected.split('-').map(Number));
  document.getElementById('reserveDateTitle').textContent='📅 '+faDigits(j[2])+' '+months[j[1]-1]+' '+faDigits(j[0]);
  document.getElementById('rHall').value='آمفی‌تئاتر غدیر';
  document.getElementById('rStart').value='';
  document.getElementById('rEnd').value='';
  document.getElementById('rTitle').value='';
  document.getElementById('rRequester').value='';
  document.getElementById('rDesc').value='';
  document.getElementById('conflict').innerHTML='';
  renderDayReserves(selected);
  show('reservePage');
}

function renderDayReserves(date){
  let rs=dayRes(date);
  if(rs.length){
    document.getElementById('dayReserves').innerHTML=rs.map(r=>`
      <div class="res-item"><div class="row"><span class="res-title">${r.title}</span><span class="badge badge-hall">${r.hall}</span></div>
      <div class="res-meta"><span>🕐 ${r.start} - ${r.end}</span><span>👤 ${r.requester}</span></div>
      <button class="btn btn-danger btn-sm mt-6" onclick="deleteRes('${r.id}')">🗑️ حذف</button>
      </div>`).join('');
  }else{
    document.getElementById('dayReserves').innerHTML='<div class="muted text-center" style="padding:10px 0">✨ رزروی برای این روز وجود ندارد</div>';
  }
}

function saveReserve(){
  let date=selected, hall=document.getElementById('rHall').value, start=document.getElementById('rStart').value, end=document.getElementById('rEnd').value, title=document.getElementById('rTitle').value.trim(), requester=document.getElementById('rRequester').value.trim(), desc=document.getElementById('rDesc').value.trim();
  let c=document.getElementById('conflict');
  c.innerHTML='';
  if(!hall||!start||!end||!title||!requester){c.innerHTML='<div class="alert alert-danger">⚠️ همه فیلدها را پر کنید</div>';return}
  if(start>=end){c.innerHTML='<div class="alert alert-danger">⚠️ ساعت پایان باید بعد از شروع باشد</div>';return}
  if(conflict(date,hall,start,end)){c.innerHTML='<div class="alert alert-danger">⛔ این سالن در این بازه رزرو شده است</div>';return}
  
  state.reservations.push({id:Date.now().toString(),date,hall,start,end,title,requester,desc});
  save();
  c.innerHTML='<div class="alert alert-success">✅ رزرو با موفقیت ثبت شد</div>';
  document.getElementById('rTitle').value='';
  document.getElementById('rRequester').value='';
  document.getElementById('rDesc').value='';
  renderDayReserves(date);
  renderCalendar();
  renderHome();
}

function deleteRes(id){
  if(confirm('آیا از حذف این رزرو مطمئن هستید؟')){
    state.reservations=state.reservations.filter(r=>r.id!==id);
    save();
    renderDayReserves(selected);
    renderCalendar();
    renderHome();
    renderReservations();
  }
}

// ===== تقویم کوچک =====
function toggleMiniCalendar(){
  let el=document.getElementById('miniCalendar');
  el.classList.toggle('open');
  if(el.classList.contains('open')){
    miniViewJ=nowJ();
    renderMiniCalendar();
  }
}

function renderMiniCalendar(){
  document.getElementById('miniMonthTitle').textContent=months[miniViewJ[1]-1]+' '+faDigits(miniViewJ[0]);
  let firstG=jalaliToGregorian(miniViewJ[0],miniViewJ[1],1);
  let firstDow=new Date(firstG[0],firstG[1]-1,firstG[2]).getDay();
  let rtlOffset=(firstDow+1)%7;
  let days=monthDays(miniViewJ[0],miniViewJ[1]);
  let names=['ش','ی','د','س','چ','پ','ج'];
  
  let html=names.map(n=>`<div class="dow">${n}</div>`).join('');
  for(let i=0;i<rtlOffset;i++) html+='<div class="day empty"></div>';
  
  for(let d=1; d<=days; d++){
    let g=jalaliToGregorian(miniViewJ[0],miniViewJ[1],d);
    let ds=gstr(g);
    let has=dayRes(ds).length;
    let isToday=ds===gstr(todayG());
    let cls='day';
    if(isToday) cls+=' today';
    if(has) cls+=' has-dot';
    html+=`<button class="${cls}" onclick="selectMiniDate('${ds}')">${faDigits(d)}</button>`;
  }
  document.getElementById('miniCalendarGrid').innerHTML=html;
}

function miniChangeMonth(n){
  miniViewJ[1]+=n;
  if(miniViewJ[1]<1){miniViewJ[1]=12; miniViewJ[0]--}
  if(miniViewJ[1]>12){miniViewJ[1]=1; miniViewJ[0]++}
  renderMiniCalendar();
}

function selectMiniDate(ds){
  let j=gregorianToJalali(...ds.split('-').map(Number));
  document.getElementById('rDateGeneral').value=faDigits(j[0])+'/'+faDigits(pad(j[1]))+'/'+faDigits(pad(j[2]));
  document.getElementById('miniCalendar').classList.remove('open');
}

// ===== ثبت عمومی =====
function saveGeneral(){
  let jDate=document.getElementById('rDateGeneral').value;
  let dateG=parseJalali(jDate);
  let date=dateG?gstr(dateG):'';
  let hall=document.getElementById('rHallGeneral').value;
  let start=document.getElementById('rStartGeneral').value;
  let end=document.getElementById('rEndGeneral').value;
  let title=document.getElementById('rTitleGeneral').value.trim();
  let requester=document.getElementById('rRequesterGeneral').value.trim();
  let desc=document.getElementById('rDescGeneral').value.trim();
  let c=document.getElementById('conflictGeneral');
  c.innerHTML='';
  if(!dateG||!hall||!start||!end||!title||!requester){c.innerHTML='<div class="alert alert-danger">⚠️ همه فیلدها را پر کنید</div>';return}
  if(start>=end){c.innerHTML='<div class="alert alert-danger">⚠️ ساعت پایان باید بعد از شروع باشد</div>';return}
  if(conflict(date,hall,start,end)){c.innerHTML='<div class="alert alert-danger">⛔ این سالن در این بازه رزرو شده است</div>';return}
  state.reservations.push({id:Date.now().toString(),date,hall,start,end,title,requester,desc});
  save();
  document.getElementById('rTitleGeneral').value='';
  document.getElementById('rRequesterGeneral').value='';
  document.getElementById('rDescGeneral').value='';
  c.innerHTML='<div class="alert alert-success">✅ رزرو با موفقیت ثبت شد</div>';
  renderHome();
  setTimeout(()=>show('reservations'),800);
}

// ===== لیست رزروها =====
function renderReservations(){
  let q=(document.getElementById('search')?.value||'').trim().toLowerCase();
  let list=state.reservations.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  if(q) list=list.filter(r=>`${r.title} ${r.requester} ${r.hall}`.toLowerCase().includes(q));
  if(list.length){
    document.getElementById('reservationList').innerHTML=list.map(r=>`
      <div class="res-item"><div class="row"><span class="res-title">${r.title}</span><span class="badge badge-hall">${r.hall}</span></div>
      <div class="res-meta"><span>📅 ${jstr(r.date.split('-').map(Number))}</span><span>🕐 ${r.start} - ${r.end}</span><span>👤 ${r.requester}</span></div>
      <button class="btn btn-danger btn-sm mt-6" onclick="deleteRes('${r.id}')">🗑️ حذف</button>
      </div>`).join('');
  }else{
    document.getElementById('reservationList').innerHTML='<div class="card muted text-center" style="padding:24px 16px">📭 رزروی پیدا نشد</div>';
  }
}

// ===== ثبت سرویس‌ورکر =====
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js')
    .then(registration => {
      console.log('ServiceWorker registered successfully');
    })
    .catch(error => {
      console.log('ServiceWorker registration failed:', error);
    });
}

// ===== شروع =====
document.getElementById('headerDate').textContent=jstr(todayG());
renderHome();
renderCalendar();
</script>
