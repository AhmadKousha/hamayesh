<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>آفلاین - سامانه رزرو</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tahoma,sans-serif;background:#eef2f7;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.container{max-width:400px;background:#fff;border-radius:24px;padding:40px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.08)}
.icon{font-size:64px;margin-bottom:16px}
h1{font-size:22px;color:#1a1a2e;margin-bottom:8px}
p{color:#6b7a8f;font-size:14px;line-height:1.8}
.btn{display:inline-block;padding:12px 30px;background:linear-gradient(135deg,#1a1a2e,#0f3460);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;margin-top:16px;font-family:Tahoma,sans-serif}
</style>
</head>
<body>
<div class="container">
  <div class="icon">📡</div>
  <h1>شما آفلاین هستید</h1>
  <p>لطفاً اتصال اینترنت خود را بررسی کنید<br>برنامه پس از اتصال مجدد کار خواهد کرد</p>
  <button class="btn" onclick="location.reload()">🔄 تلاش مجدد</button>
</div>
</body>
</html>
